name: Deploy Techastra to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Techastra-CodeRescue
        run: |
          cd Techastra-CodeRescue
          npm install
          npm run build

      - name: Build portfolio-inner-site
        run: |
          cd portfolio-inner-site
          npm install
          mkdir -p public/coderescue
          cp -r ../Techastra-CodeRescue/dist/* public/coderescue/
          npm run build

      - name: Build portfolio-website
        run: |
          cd portfolio-website
          npm install
          npm run build

      - name: Assemble Unified Static Site
        run: |
          mkdir -p _site/os
          cp -r portfolio-website/public/* _site/
          cp -r portfolio-inner-site/build/* _site/os/
          touch _site/.nojekyll
          cp _site/index.html _site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
