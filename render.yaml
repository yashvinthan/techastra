services:
  - type: web
    name: techastra-2026
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps && cd coderescue && npm install && cd .. && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: ADMIN_PASSKEY
        value: techastra2026
